<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ddblite demo</title>
  <script type="module" crossorigin src="/ddblite/assets/index-BMRdYgp_.js"></script>
  <link rel="stylesheet" crossorigin href="/ddblite/assets/index-CY3qwyQw.css">
</head>
<body>
<header>
  <h1>ddblite</h1>
  <span id="status" data-testid="status">起動中…</span>
  <span class="spacer"></span>
  <button id="sample" data-testid="sample">サンプルのテーブルを作る</button>
  <button id="export" data-testid="export">書き出し</button>
  <label class="button">読み込み<input id="import" data-testid="import" type="file" accept="application/json" hidden></label>
  <button id="reset" data-testid="reset" class="danger">全テーブルを消す</button>
</header>
<main>
  <nav>
    <h2>テーブル <button id="refresh" data-testid="refresh" title="再読み込み">↻</button></h2>
    <ul id="tables" data-testid="tables"></ul>
  </nav>
  <section id="items-pane">
    <h2 id="items-title">項目</h2>
    <div id="table-info" data-testid="table-info"></div>
    <div class="toolbar">
      <button id="prev" data-testid="prev" disabled>← 前</button>
      <span id="page" data-testid="page"></span>
      <button id="next" data-testid="next" disabled>次 →</button>
    </div>
    <div id="items" data-testid="items"></div>
    <div id="editor" data-testid="editor" hidden>
      <h2 id="editor-title" data-testid="editor-title">項目の編集（DynamoDB JSON）</h2>
      <p class="note" id="editor-help">表の行を選ぶと、その項目をここで編集できます。「新規」はキーの雛形から始めます。値は AttributeValue の形で書きます（例 <code>{"Artist": {"S": "Pixies"}, "Year": {"N": "1989"}}</code>）。</p>
      <p class="warn" id="editor-keynote" data-testid="editor-keynote"></p>
      <textarea id="editor-json" data-testid="editor-json" rows="10" spellcheck="false" placeholder="行を選ぶか「新規」を押してください"></textarea>
      <div class="toolbar">
        <button id="editor-save" data-testid="editor-save" disabled>保存（PutItem）</button>
        <button id="editor-new" data-testid="editor-new">新規</button>
        <span class="spacer"></span>
        <button id="editor-delete" data-testid="editor-delete" class="danger" disabled>削除（DeleteItem）</button>
      </div>
      <div id="editor-status" data-testid="editor-status"></div>
    </div>
  </section>
  <section id="partiql-pane">
    <h2>PartiQL</h2>
    <div class="toolbar">
      <label>サンプル <select id="samples" data-testid="samples"><option value="">（選ぶと入力欄に入ります）</option></select></label>
    </div>
    <p class="note" id="sample-note" data-testid="sample-note"></p>
    <textarea id="stmt" data-testid="stmt" rows="4" spellcheck="false">SELECT * FROM "Music" WHERE Artist = 'Pixies'</textarea>
    <div class="toolbar">
      <label>送り方 <select id="mode" data-testid="mode">
        <option value="single">1 文（ExecuteStatement）</option>
        <option value="batch">バッチ（BatchExecuteStatement）</option>
        <option value="transaction">トランザクション（ExecuteTransaction）</option>
      </select></label>
      <button id="run" data-testid="run">実行（Ctrl+Enter）</button>
    </div>
    <p class="note" id="mode-note" data-testid="mode-note"></p>
    <div id="result" data-testid="result"></div>
  </section>
</main>
</body>
</html>
